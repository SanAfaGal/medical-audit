[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-audit-v2"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "cryptography>=42,<44",
    "structlog>=24",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "tqdm>=4.66",
    "playwright>=1.44,<2",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "aiofiles>=23",
    "python-dotenv>=1.0",
    "py7zr>=0.20",
    "rarfile>=4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "mypy>=1.10,<2",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "detect-secrets>=1.5.0,<2",
    "vulture>=2.15,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "seeds*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-ra", "--tb=short", "--strict-markers"]
markers = [
    "db: tests that require a live PostgreSQL instance",
    "slow: tests that are slow (large file I/O)",
    "pdf: tests that require real PDF fixture files",
    "e2e: browser smoke tests against a running server (opt-in: set E2E_BASE_URL)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/models/*", "*/__pycache__/*", "seeds/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["TID251", "B904", "B905", "BLE001", "PLW2901"]

# app/core es lógica de dominio pura: no puede depender del resto de app/.
# El ban aplica a todo el repo; las capas que sí pueden importarlos se excluyen abajo.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"app.routers".msg = "app/core no debe importar capas de aplicación."
"app.services".msg = "app/core no debe importar capas de aplicación."
"app.repositories".msg = "app/core no debe importar capas de aplicación."
"app.models".msg = "app/core no debe importar capas de aplicación."
"app.schemas".msg = "app/core no debe importar capas de aplicación."
"app.database".msg = "app/core no debe importar capas de aplicación."
"app.config".msg = "app/core no debe importar capas de aplicación."
"app.crypto".msg = "app/core no debe importar capas de aplicación."
"app.paths".msg = "app/core no debe importar capas de aplicación."
"app.main".msg = "app/core no debe importar capas de aplicación."

[tool.ruff.lint.per-file-ignores]
"app/routers/**" = ["TID251"]
"app/services/**" = ["TID251"]
"app/repositories/**" = ["TID251"]
"app/models/**" = ["TID251"]
"app/schemas/**" = ["TID251"]
"app/config.py" = ["TID251"]
"app/crypto.py" = ["TID251"]
"app/database.py" = ["TID251"]
"app/main.py" = ["TID251"]
"app/paths.py" = ["TID251"]
"tests/**" = ["TID251"]
"alembic/**" = ["TID251"]
"seeds/**" = ["TID251"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = false

[[tool.mypy.overrides]]
# Third-party libraries without stubs
module = [
    "fitz.*",
    "playwright.*",
    "google.*",
    "googleapiclient.*",
    "tqdm.*",
    "structlog.*",
    "py7zr.*",
    "rarfile.*",
    "pandas",
    "pandas.*",
    "openpyxl",
    "openpyxl.*",
    "asyncpg",
    "asyncpg.*",
    "aiofiles",
    "aiofiles.*",
]
ignore_missing_imports = true

[tool.vulture]
min_confidence = 80
paths = ["app"]
ignore_names = [
    "test_*",
    "setUp",
    "tearDown",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0,<2",
    "vulture>=2.15,<3",
]
