  <!-- ── Filters ── -->
  <section x-show="$store.ctx.periodId" x-cloak
           class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">

    <!-- Filter header -->
    <div class="px-4 py-2.5 flex items-center justify-between border-b border-gray-100 cursor-pointer select-none"
         @click="filtersOpen = !filtersOpen">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs font-semibold text-gray-600 uppercase tracking-wider">
          <i class="fa-solid fa-filter text-gray-400 mr-1.5"></i>Filtros
        </span>
        <!-- Active filter chips -->
        <template x-if="filterStatusId">
          <span class="filter-chip">
            Estado: <strong x-text="folderStatuses.find(f=>f.id==filterStatusId)?.status"></strong>
            <button @click.stop="filterStatusId=''; page=1; loadInvoices()"><i class="fa-solid fa-xmark text-xs"></i></button>
          </span>
        </template>
        <template x-if="filterAdminType">
          <span class="filter-chip">
            Tipo: <strong x-text="filterAdminType"></strong>
            <button @click.stop="filterAdminType=''; filterAdminCanonical=''; page=1; loadInvoices()"><i class="fa-solid fa-xmark text-xs"></i></button>
          </span>
        </template>
        <template x-if="filterAdminCanonical">
          <span class="filter-chip">
            Admin: <strong x-text="filterAdminCanonical"></strong>
            <button @click.stop="filterAdminCanonical=''; page=1; loadInvoices()"><i class="fa-solid fa-xmark text-xs"></i></button>
          </span>
        </template>
        <template x-if="filterContractCanonical">
          <span class="filter-chip">
            Contrato: <strong x-text="filterContractCanonical"></strong>
            <button @click.stop="filterContractCanonical=''; page=1; loadInvoices()"><i class="fa-solid fa-xmark text-xs"></i></button>
          </span>
        </template>
        <template x-if="filterServiceTypeId">
          <span class="filter-chip">
            Servicio: <strong x-text="serviceTypes.find(s=>s.id==filterServiceTypeId)?.code"></strong>
            <button @click.stop="filterServiceTypeId=''; page=1; loadInvoices()"><i class="fa-solid fa-xmark text-xs"></i></button>
          </span>
        </template>
        <template x-if="searchQuery">
          <span class="filter-chip">
            Buscar: <strong x-text="searchQuery"></strong>
            <button @click.stop="searchQuery=''; page=1; loadInvoices()"><i class="fa-solid fa-xmark text-xs"></i></button>
          </span>
        </template>
        <template x-if="filterFindingDocTypeId">
          <span class="filter-chip" style="background:#f0fdfa;color:#0f766e;border-color:#99f6e4">
            Hallazgo: <strong x-text="findingsSummary.find(f=>f.doc_type_id===filterFindingDocTypeId)?.code"></strong>
            <button @click.stop="filterFindingDocTypeId=null; page=1; loadInvoices()"><i class="fa-solid fa-xmark text-xs"></i></button>
          </span>
        </template>
      </div>
      <div class="flex items-center gap-3">
        <template x-if="hasActiveFilters">
          <button @click.stop="clearFilters()"
                  class="text-xs text-red-500 hover:text-red-700 font-medium transition-colors">
            Limpiar todo
          </button>
        </template>
        <a x-show="$store.ctx.periodId"
           :href="`/api/invoices/export?period_id=${$store.ctx.periodId}`"
           @click.stop
           class="flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-lg transition-colors"
           style="color:var(--sky);border:1px solid var(--sky-border);background:var(--sky-soft)"
           onmouseover="this.style.background='var(--sky-border)'" onmouseout="this.style.background='var(--sky-soft)'">
          <i class="fa-solid fa-file-excel text-[10px]"></i>
          Exportar Excel
        </a>
        <i class="fa-solid fa-chevron-down text-gray-400 text-xs transition-transform duration-200"
           :class="filtersOpen ? 'rotate-180' : ''"></i>
      </div>
    </div>

    <!-- Filter body -->
    <div x-show="filtersOpen" x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 -translate-y-1" x-transition:enter-end="opacity-100 translate-y-0" class="px-4 py-3">
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
        <div>
          <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Estado</label>
          <select x-model="filterStatusId" @change="page=1; loadInvoices()"
                  class="field-select w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs text-gray-700 focus:ring-2 focus:ring-teal-500 focus:border-teal-400">
            <option value="">Todos</option>
            <template x-for="fs in folderStatuses" :key="fs.id">
              <option :value="fs.id" x-text="fs.status"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Tipo adm.</label>
          <select x-model="filterAdminType" @change="filterAdminCanonical=''; page=1; loadInvoices()"
                  class="field-select w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs text-gray-700 focus:ring-2 focus:ring-teal-500 focus:border-teal-400">
            <option value="">Todos</option>
            <template x-for="t in uniqueAdminTypes" :key="t">
              <option :value="t" x-text="t"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Administradora</label>
          <select x-model="filterAdminCanonical" @change="filterContractCanonical=''; page=1; loadInvoices()"
                  class="field-select w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs text-gray-700 focus:ring-2 focus:ring-teal-500 focus:border-teal-400">
            <option value="">Todas</option>
            <template x-for="name in filteredAdmins" :key="name">
              <option :value="name" x-text="name"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Contrato</label>
          <select x-model="filterContractCanonical" @change="page=1; loadInvoices()"
                  class="field-select w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs text-gray-700 focus:ring-2 focus:ring-teal-500 focus:border-teal-400">
            <option value="">Todos</option>
            <template x-for="name in uniqueContracts" :key="name">
              <option :value="name" x-text="name"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Servicio</label>
          <select x-model="filterServiceTypeId" @change="page=1; loadInvoices()"
                  class="field-select w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs text-gray-700 focus:ring-2 focus:ring-teal-500 focus:border-teal-400">
            <option value="">Todos</option>
            <template x-for="st in serviceTypes" :key="st.id">
              <option :value="st.id" x-text="st.code + (st.description ? ' — ' + st.description : '')"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1">Buscar</label>
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-300 text-xs pointer-events-none"></i>
            <input type="text" x-model="searchQuery" @input.debounce.400ms="page=1; loadInvoices()"
                   placeholder="100000; 100001; ..."
                   class="w-full border border-gray-200 rounded-lg pl-7 pr-2.5 py-1.5 text-xs text-gray-700 focus:ring-2 focus:ring-teal-500 focus:border-teal-400" />
          </div>
        </div>
      </div>
    </div>
  </section>
