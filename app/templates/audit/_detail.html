    <!-- ── Detail panel ── -->
    <div x-show="selectedInvoice" x-cloak
         class="detail-sticky w-80 xl:w-96 shrink-0 bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden detail-enter"
         :key="selectedInvoice && selectedInvoice.id">

      <!-- Detail header -->
      <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between bg-gray-50/60">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-7 h-7 rounded-lg bg-teal-100 flex items-center justify-center shrink-0">
            <i class="fa-solid fa-file-invoice text-teal-600 text-xs"></i>
          </div>
          <div class="min-w-0">
            <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Factura</div>
            <div class="font-mono font-bold text-teal-700 text-sm leading-none"
                 x-text="selectedInvoice && selectedInvoice.invoice_number"></div>
          </div>
        </div>
        <button @click="selectedInvoice = null"
                class="w-7 h-7 rounded-lg flex items-center justify-center text-gray-400 hover:bg-gray-200 hover:text-gray-600 transition-colors">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <div class="p-4 space-y-4">
        <!-- Info grid -->
        <div class="grid grid-cols-2 gap-3 text-xs">
          <div>
            <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Paciente</div>
            <div class="font-medium text-gray-800 leading-snug" x-text="selectedInvoice && selectedInvoice.patient_name || 'N/A'"></div>
          </div>
          <div>
            <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Servicio</div>
            <div class="font-medium text-gray-700" x-text="selectedInvoice && selectedInvoice.service_type_code || '—'"></div>
          </div>
          <div>
            <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Admisión</div>
            <div class="font-mono font-medium text-gray-700" x-text="selectedInvoice && selectedInvoice.admission || '—'"></div>
          </div>
          <div class="col-span-2">
            <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Administradora</div>
            <div class="font-medium text-gray-700 leading-snug" x-text="selectedInvoice && selectedInvoice.admin_canonical || '—'"></div>
            <template x-if="selectedInvoice && selectedInvoice.admin_type">
              <span class="inline-block mt-0.5 px-1.5 py-px rounded text-[10px] font-semibold bg-sky-100 text-sky-700"
                    x-text="selectedInvoice.admin_type"></span>
            </template>
          </div>
          <div class="col-span-2">
            <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Contrato</div>
            <div class="font-medium text-gray-700" x-text="selectedInvoice && selectedInvoice.contract_canonical || '—'"></div>
          </div>
        </div>

        <!-- Status change -->
        <div class="pt-1">
          <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Estado de la carpeta</div>
          <select x-model="detailStatusId" @change="updateStatus()"
                  class="field-select w-full border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-700 font-medium focus:ring-2 focus:ring-teal-500">
            <template x-for="fs in folderStatuses" :key="fs.id">
              <option :value="fs.id" x-text="fs.status"></option>
            </template>
          </select>
        </div>

        <!-- Findings -->
        <div>
          <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2">
            Hallazgos registrados
            <span x-show="missingFiles.length > 0"
                  class="ml-1 inline-block px-1.5 py-px rounded-full bg-red-100 text-red-600"
                  x-text="missingFiles.length"></span>
          </div>
          <div class="space-y-1.5">
            <template x-for="mf in missingFiles" :key="mf.id">
              <div class="flex items-center justify-between px-3 py-2 bg-red-50 border border-red-100 rounded-lg">
                <div class="flex items-center gap-2 min-w-0">
                  <i class="fa-solid fa-triangle-exclamation text-red-400 text-xs shrink-0"></i>
                  <span class="text-xs font-medium text-red-800 truncate" x-text="docTypeLabel(mf.doc_type_id)"></span>
                </div>
                <button @click="deleteFile(mf.doc_type_id)"
                        class="shrink-0 w-6 h-6 flex items-center justify-center text-red-300 hover:text-red-600 hover:bg-red-100 rounded transition-colors ml-2">
                  <i class="fa-solid fa-trash text-[10px]"></i>
                </button>
              </div>
            </template>
            <template x-if="missingFiles.length === 0">
              <div class="flex items-center gap-1.5 text-xs text-emerald-600 px-3 py-2 bg-emerald-50 rounded-lg border border-emerald-100">
                <i class="fa-solid fa-circle-check"></i>Sin hallazgos registrados
              </div>
            </template>
          </div>
        </div>

        <!-- Add finding -->
        <div class="flex gap-2">
          <select x-model="newDocTypeId"
                  class="field-select flex-1 min-w-0 border border-gray-200 rounded-lg px-2.5 py-2 text-xs text-gray-700 focus:ring-2 focus:ring-red-400">
            <option value="">— Agregar hallazgo —</option>
            <template x-for="dt in docTypes" :key="dt.id">
              <option :value="dt.id" x-text="dt.code"></option>
            </template>
          </select>
          <button @click="addFile()" :disabled="!newDocTypeId"
                  class="shrink-0 px-3 py-2 bg-red-500 text-white text-xs font-semibold rounded-lg hover:bg-red-600 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <!-- Delete invoice -->
        <div class="pt-2 border-t border-gray-100">
          <template x-if="!confirmDeleteInvoice">
            <button @click="confirmDeleteInvoice = true"
                    class="w-full py-2 text-xs text-red-400 border border-red-100 rounded-lg hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-colors font-medium">
              <i class="fa-solid fa-trash mr-1.5"></i>Eliminar esta factura
            </button>
          </template>
          <template x-if="confirmDeleteInvoice">
            <div class="space-y-2">
              <p class="text-xs text-red-700 font-medium text-center">¿Eliminar factura y todos sus hallazgos?</p>
              <div class="flex gap-2">
                <button @click="deleteInvoice()"
                        class="flex-1 py-2 text-xs bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 transition-colors">
                  Confirmar
                </button>
                <button @click="confirmDeleteInvoice = false"
                        class="flex-1 py-2 text-xs text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
                  Cancelar
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
    <!-- ── /Detail panel ── -->
