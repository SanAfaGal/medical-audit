          <!-- ── Modo Split ─────────────────────────────────────────── -->
          <template x-if="pdfMode === 'split'">
            <div class="flex-1 flex flex-col gap-4 p-4 overflow-y-auto">
              <div class="text-sm font-semibold text-slate-700">
                Dividir: <span class="font-normal text-slate-500" x-text="selectedEntry && selectedEntry.name"></span>
              </div>
              <div class="space-y-3">
                <div>
                  <label class="block text-xs font-medium text-slate-600 mb-1">
                    Rangos de páginas (ej: <code class="text-sky-600">1-3, 5</code>)
                  </label>
                  <input x-model="splitRanges"
                         @input.debounce.300ms="updateSplitPreview()"
                         type="text"
                         placeholder="Dejar vacío para dividir página a página"
                         class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-400">
                  <p x-show="splitPreviewError" x-text="splitPreviewError" class="text-xs text-red-500 mt-1"></p>
                </div>

                <!-- Preview: miniaturas coloreadas por parte -->
                <template x-if="thumbnails.length === 0">
                  <div class="flex items-center justify-center py-8 text-slate-400 text-sm">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i>
                    Cargando miniaturas…
                  </div>
                </template>
                <div class="grid grid-cols-3 gap-2">
                  <template x-for="(thumb, idx) in thumbnails" :key="idx">
                    <div class="relative rounded-lg overflow-hidden border-2 bg-slate-50 transition-colors"
                         :class="splitGroupOf(idx) === -1 ? 'border-transparent opacity-40' : splitPalette[splitGroupOf(idx) % splitPalette.length]">
                      <img :src="'data:image/png;base64,' + thumb"
                           class="w-full h-auto block"
                           :alt="'Página ' + (idx+1)">
                      <div class="absolute bottom-0 left-0 right-0 text-white text-[10px] text-center py-0.5 bg-black/50"
                           x-text="splitGroupOf(idx) === -1 ? 'Excluida' : 'Parte ' + (splitGroupOf(idx) + 1)"></div>
                    </div>
                  </template>
                </div>

                <button @click="executeSplit()"
                        class="w-full py-2 rounded-lg bg-sky-500 text-white text-sm font-semibold hover:bg-sky-600 transition-colors">
                  <i class="fa-solid fa-scissors mr-1.5"></i>
                  Dividir PDF
                </button>
              </div>
            </div>
          </template>
