          <!-- ── Modo Reorder ───────────────────────────────────────── -->
          <template x-if="pdfMode === 'reorder'">
            <div class="flex-1 flex flex-col min-h-0">
              <div class="px-4 py-2 border-b border-slate-100 shrink-0 flex items-center justify-between">
                <span class="text-xs font-medium text-slate-600">
                  Arrastra para reordenar, basura para eliminar
                  <span class="text-slate-400" x-text="'· ' + pageOrder.length + ' de ' + thumbnails.length + ' páginas'"></span>
                </span>
                <button @click="executeReorder()"
                        :disabled="!pageOrder.length"
                        class="px-3 py-1.5 rounded-lg bg-violet-500 text-white text-xs font-semibold hover:bg-violet-600 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                  <i class="fa-solid fa-floppy-disk mr-1"></i>
                  Guardar orden
                </button>
              </div>
              <div class="flex-1 overflow-y-auto p-3">
                <template x-if="thumbnails.length === 0">
                  <div class="flex items-center justify-center h-full text-slate-400 text-sm">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i>
                    Cargando miniaturas…
                  </div>
                </template>
                <div class="grid grid-cols-3 gap-2">
                  <template x-for="(imgIdx, pos) in pageOrder" :key="imgIdx">
                    <div draggable="true"
                         @dragstart="reorderDragStart($event, pos)"
                         @dragover.prevent
                         @drop="reorderDrop($event, pos)"
                         class="group relative rounded-lg overflow-hidden border-2 border-transparent hover:border-violet-400 cursor-grab active:cursor-grabbing transition-colors bg-slate-50">
                      <img :src="'data:image/png;base64,' + thumbnails[imgIdx]"
                           class="w-full h-auto block"
                           :alt="'Página ' + (imgIdx+1)">
                      <button @click.stop="reorderDeletePage(pos)"
                              @mousedown.stop
                              title="Eliminar página"
                              class="absolute top-1 right-1 w-5 h-5 flex items-center justify-center rounded-md bg-black/50 text-white opacity-0 group-hover:opacity-100 hover:bg-red-500 transition-all">
                        <i class="fa-solid fa-trash text-[10px]"></i>
                      </button>
                      <div class="absolute bottom-0 left-0 right-0 bg-black/50 text-white text-[10px] text-center py-0.5"
                           x-text="'Pág. ' + (imgIdx+1)"></div>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </template>
