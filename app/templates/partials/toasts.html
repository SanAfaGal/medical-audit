{# The single toast stack for every page. State lives in Alpine.store('toast') (static/js/toast.js). #}
<template x-teleport="body">
  <div class="fixed bottom-5 right-5 z-[60] flex flex-col-reverse gap-2 items-end max-w-xs pointer-events-none">
    <template x-for="t in $store.toast.items" :key="t.id">
      <div class="pointer-events-auto w-full"
           x-show="true"
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 translate-y-2"
           x-transition:enter-end="opacity-100 translate-y-0"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 translate-y-2">
        <div :class="{
               'border-emerald-200 text-emerald-800 shadow-emerald-100': t.type === 'ok',
               'border-sky-200    text-sky-800    shadow-sky-100':    t.type === 'loading',
               'border-amber-200  text-amber-800  shadow-amber-100':  t.type === 'warn',
               'border-red-200    text-red-800    shadow-red-100':    t.type === 'err'
             }"
             class="bg-white px-4 py-3 rounded-xl border text-xs flex items-center gap-2.5 shadow-lg">
          <i :class="{
               'fa-solid fa-circle-check text-emerald-500':       t.type === 'ok',
               'fa-solid fa-spinner fa-spin text-sky-500':        t.type === 'loading',
               'fa-solid fa-triangle-exclamation text-amber-500': t.type === 'warn',
               'fa-solid fa-circle-xmark text-red-500':           t.type === 'err'
             }"
             class="shrink-0"></i>
          <span x-text="t.message" class="flex-1 break-words min-w-0"></span>
          <button @click="$store.toast.dismiss(t.id)"
                  class="opacity-40 hover:opacity-80 transition-opacity ml-1" aria-label="Cerrar">
            <i class="fa-solid fa-xmark text-[10px]"></i>
          </button>
        </div>
      </div>
    </template>
  </div>
</template>
