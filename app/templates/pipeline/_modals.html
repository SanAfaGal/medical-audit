<!-- ── Modal de confirmación: eliminar archivo sobrante ───────────────────── -->
<template x-if="deleteConfirmPending">
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4"
       style="background:rgba(0,0,0,0.55);backdrop-filter:blur(3px)"
       @click.self="deleteConfirmPending = null"
       @keydown.escape.window="deleteConfirmPending = null">
    <div class="flex flex-col gap-4 rounded-2xl p-6 max-w-sm w-full shadow-2xl"
         style="background:var(--bg-surface);border:1px solid var(--border)">
      <!-- Icono + título -->
      <div class="flex items-start gap-3">
        <div class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center"
             style="background:rgba(239,68,68,0.1)">
          <i class="fa-solid fa-trash text-red-500 text-sm"></i>
        </div>
        <div>
          <div class="text-sm font-semibold mb-1" style="color:var(--text-1)">Eliminar archivo</div>
          <div class="text-xs leading-relaxed" style="color:var(--text-2)">
            ¿Eliminar del disco
            <span class="font-mono font-semibold px-1 py-0.5 rounded text-xs"
                  style="background:var(--bg-subtle);color:var(--text-1)"
                  x-text="deleteConfirmPending.sob.filename"></span>?
            Esta acción no se puede deshacer.
          </div>
        </div>
      </div>
      <!-- Acciones -->
      <div class="flex gap-2 justify-end">
        <button @click="deleteConfirmPending = null"
                class="px-4 py-1.5 rounded-lg text-xs font-medium transition-colors"
                style="background:var(--bg-subtle);color:var(--text-2);border:1px solid var(--border)">
          Cancelar
        </button>
        <button @click="executeDeleteSurplus()"
                class="px-4 py-1.5 rounded-lg text-xs font-semibold text-white transition-colors bg-red-500 hover:bg-red-600">
          <i class="fa-solid fa-trash mr-1.5"></i>
          Sí, eliminar
        </button>
      </div>
    </div>
  </div>
</template>

<!-- Image preview modal -->
<template x-if="previewFile">
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4"
       style="background:rgba(0,0,0,0.75);backdrop-filter:blur(4px)"
       @click.self="previewFile = null"
       @keydown.escape.window="previewFile = null">
    <div class="relative flex flex-col rounded-xl overflow-hidden max-w-3xl w-full max-h-[90vh]"
         style="background:var(--bg-surface);border:1px solid var(--border)">
      <!-- Modal header -->
      <div class="px-4 py-3 flex items-center justify-between shrink-0"
           style="background:var(--bg-subtle);border-bottom:1px solid var(--border)">
        <div class="flex items-center gap-2 min-w-0">
          <i class="fa-solid fa-image text-sm shrink-0" style="color:#60a5fa"></i>
          <span class="text-sm font-mono truncate" style="color:var(--text-1)"
                x-text="previewFile.filename"></span>
        </div>
        <button @click="previewFile = null"
                class="shrink-0 ml-3 p-1.5 rounded-lg transition-colors hover:opacity-75"
                style="color:var(--text-3)">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <!-- Image -->
      <div class="overflow-auto flex items-center justify-center p-4 flex-1"
           style="background:repeating-conic-gradient(#1a1a1a 0% 25%,#111 0% 50%) 0 0/16px 16px">
        <img :src="`/api/pipeline/file-preview?institution_id=${$store.ctx.institutionId}&period_id=${$store.ctx.periodId}&rel_path=${encodeURIComponent(previewFile.rel_path)}`"
             :alt="previewFile.filename"
             class="max-w-full max-h-[70vh] object-contain rounded shadow-lg"
             style="image-rendering:auto" />
      </div>
    </div>
  </div>
</template>
